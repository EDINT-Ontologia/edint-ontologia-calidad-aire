      - [dct:publisher, "$(dataProvider)", xsd:anyURI]
      - [dct:source, "$(source)"]
      - p: dct:identifier
        o:
          value: "$(entityId)-$(_id)-NO2"
          type: literal

  result_NO2:
    sources:
      - air-quality-source
    s: https://example.org/recurso/resultadoObservacion/$(_id)/NO2
    po:
      - [a, qudt:QuantityValue]
      - [qudt:value, $(NO2)]
#      - [qudt:unit, unit:MicroGM-PER-M3]

  observation_O3:
    sources:
      - air-quality-source
    s: https://example.org/recurso/observacion/$(_id)/O3
    po:
      - [a, edintmed:EnvironmentalObservation]
#      - [dct:identifier, "$(entityId)-$(_id)-O3"]
      - [sosa:madeBySensor, "https://example.org/recurso/sensor/$(refDevice)/O3~iri"]
      - [sosa:observedProperty, edintkos-vars:O3Concentration]
      - [sosa:hasFeatureOfInterest, edintkos-foi:Air]
      - [sosa:phenomenonTime, "https://example.org/recurso/instante/$(_id)~iri"]
      - [sosa:hasResult, "https://example.org/recurso/resultadoObservacion/$(_id)/O3~iri"]
      - [dct:publisher, "$(dataProvider)", xsd:anyURI]
      - [dct:source, "$(source)"]
      - p: dct:identifier
        o:
          value: "$(entityId)-$(_id)-O3"
          type: literal

  result_O3:
    sources: [air-quality-source]
    s: https://example.org/recurso/resultadoObservacion/$(_id)/O3
    po:
      - [a, qudt:QuantityValue]
      - [qudt:value, $(O3)]
