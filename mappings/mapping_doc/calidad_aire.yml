      - [sosa:hasResult, "https://example.org/recurso/resultadoObservacion/$(_id)/NO~iri"]
      - [dct:publisher, "$(dataProvider)", xsd:anyURI]
      - [dct:source, "$(source)"]
      - p: dct:identifier
        o:
          value: "$(entityId)-$(_id)-NO"
          type: literal

  result_NO:
    sources:
      - air-quality-source
    s: https://example.org/recurso/resultadoObservacion/$(_id)/NO
    po:
      - [a, qudt:QuantityValue]
      - [qudt:value, $(NO)]
#      - [qudt:unit, unit:MicroGM-PER-M3]

  observation_NO2:
    sources:
      - air-quality-source
    s: https://example.org/recurso/observacion/$(_id)/NO2
